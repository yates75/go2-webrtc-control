[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "go2-webrtc-control"
version = "0.1.0"
description = "Async helper for controlling a Unitree Go2 Pro over WebRTC"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "go2-webrtc-connect @ file:./vendor/go2_webrtc_connect",
    "pynput",
    "fastapi",
    "uvicorn",
    "aiortc",
    "av",
]

[project.optional-dependencies]
tracking = ["ultralytics", "opencv-python", "lap"]

[project.scripts]
go2-control = "go2_control.cli:main"
go2-demo = "go2_control.demo:main"
go2-teleop = "go2_control.pynput_teleop:main"
go2-vr-bridge = "go2_control.vr_bridge:main"
go2-object-tracker = "go2_control.object_tracker:main"

[tool.setuptools]
packages = ["go2_control"]
