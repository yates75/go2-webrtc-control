<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go2 Routine Simulator</title>
  <style>
    :root {
      --bg-ink: #0c1b1f;
      --bg-deep: #132a30;
      --panel: #f6f2e8;
      --accent: #f28f3b;
      --accent-2: #2a9d8f;
      --text: #1f2933;
      --muted: #5c6670;
      --grid: rgba(16, 42, 48, 0.16);
      --trail: #e76f51;
      --dog: #1f2933;
      --dog-detail: #f4a261;
      --ok: #2a9d8f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next", "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 18%, rgba(242, 143, 59, 0.35) 0%, rgba(242, 143, 59, 0.0) 45%),
        radial-gradient(circle at 78% 22%, rgba(42, 157, 143, 0.30) 0%, rgba(42, 157, 143, 0.0) 43%),
        linear-gradient(140deg, var(--bg-ink), var(--bg-deep));
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .app {
      width: min(1200px, 100%);
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
    }

    .card {
      background: var(--panel);
      border-radius: 18px;
      box-shadow: 0 20px 45px rgba(8, 22, 25, 0.35);
      overflow: hidden;
    }

    .controls {
      padding: 22px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    h1 {
      margin: 0;
      font-size: 1.55rem;
      letter-spacing: 0.02em;
      line-height: 1.15;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 0.94rem;
    }

    label {
      font-size: 0.82rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      text-transform: uppercase;
      font-weight: 700;
    }

    select,
    input[type="range"] {
      width: 100%;
    }

    select {
      border: 2px solid #e1d9ca;
      background: #fffdf7;
      border-radius: 10px;
      padding: 10px;
      color: var(--text);
      font-size: 0.95rem;
    }

    .btn-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 10px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease;
    }

    button:hover {
      transform: translateY(-1px);
      filter: brightness(0.97);
    }

    .btn-play {
      background: var(--accent-2);
      color: #fff;
    }

    .btn-pause {
      background: #264653;
      color: #fff;
    }

    .btn-reset {
      background: var(--accent);
      color: #fff;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 6px;
    }

    .stat {
      background: #fff;
      border: 1px solid #ece5d8;
      border-radius: 10px;
      padding: 10px;
    }

    .stat .k {
      font-size: 0.73rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-weight: 700;
    }

    .stat .v {
      font-size: 1rem;
      font-weight: 700;
      margin-top: 3px;
    }

    .timeline {
      border-top: 1px solid #e9e1d3;
      margin-top: 4px;
      padding-top: 12px;
      max-height: 260px;
      overflow: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .step {
      background: #fff;
      border-radius: 9px;
      border: 1px solid #ebe3d6;
      padding: 8px 10px;
      font-size: 0.87rem;
      color: var(--muted);
    }

    .step.active {
      border-color: var(--accent-2);
      color: var(--text);
      box-shadow: 0 0 0 2px rgba(42, 157, 143, 0.15);
      font-weight: 700;
    }

    .sim {
      position: relative;
      background: #f5eee0;
      min-height: 650px;
      display: flex;
      flex-direction: column;
    }

    .sim-head {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #d9cfbe;
      background: linear-gradient(180deg, #fff7e7 0%, #f8f0df 100%);
      font-size: 0.92rem;
      color: var(--muted);
    }

    .badge {
      background: #fff;
      border: 1px solid #e3d8c5;
      border-radius: 999px;
      padding: 5px 10px;
      font-weight: 700;
      color: #31414f;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      flex: 1;
      background: linear-gradient(180deg, rgba(250, 243, 230, 1) 0%, rgba(240, 228, 208, 1) 100%);
    }

    .foot {
      padding: 8px 12px 12px;
      font-size: 0.78rem;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      .app {
        grid-template-columns: 1fr;
      }

      .sim {
        min-height: 520px;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="card controls">
      <h1>Go2 Move Simulator</h1>
      <p class="subtitle">Animation preview built from your routine files. Units are approximate for visualization.</p>

      <label for="routine">Program</label>
      <select id="routine"></select>

      <label for="speed">Playback Speed</label>
      <input id="speed" type="range" min="0.25" max="2" step="0.25" value="1" />

      <div class="btn-row">
        <button class="btn-play" id="play">Play</button>
        <button class="btn-pause" id="pause">Pause</button>
        <button class="btn-reset" id="reset">Reset</button>
      </div>

      <div class="stat-grid">
        <div class="stat"><div class="k">Current Step</div><div class="v" id="stat-step">-</div></div>
        <div class="stat"><div class="k">Pose</div><div class="v" id="stat-pose">Idle</div></div>
        <div class="stat"><div class="k">Position</div><div class="v" id="stat-pos">0.00, 0.00</div></div>
        <div class="stat"><div class="k">Heading</div><div class="v" id="stat-heading">0°</div></div>
      </div>

      <div class="timeline" id="timeline"></div>
    </section>

    <section class="card sim">
      <div class="sim-head">
        <span id="routineLabel">demo.py</span>
        <span class="badge" id="badge">Stopped</span>
      </div>
      <canvas id="simCanvas" width="900" height="620" aria-label="Go2 simulation canvas"></canvas>
      <div class="foot">Legend: orange trail = path; body tilt and tail movement are exaggerated for visibility.</div>
    </section>
  </main>

  <script src="./move_simulation.js"></script>
</body>
</html>
